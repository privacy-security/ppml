program: run.sh
project: privacy_preserving_federated_learning
method: grid

parameters:
  dataset:
    value: "cifar10"
  aggregation_type:
    value: "regular"
  dp:
    value: False
  n_clients:
    values: [3, 6, 10]
  partition_type:
    value: "iid"
  learning_rate:
    value: 0.0005
  batch_size:
    value: 16
  epochs:
    value: 50
  l2_norm_clip:
    value: 70
  seed:
    values: [0, 1, 2, 3, 4]

command:
  - ${env}
  - bash
  - ${program}
  - ${args}
