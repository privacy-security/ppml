  partition_type: iid
  n_clients:
  - 3
  - 10
  seed:
  - 0
  - 1
  - 2
  - 3
  - 4
  leaky_train_frac: 0.1
  canary_frac: 0.01
  canary_dups: 5
  canary_flip: true
