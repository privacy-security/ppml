program: run.sh
project: privacy_preserving_federated_learning
method: grid

parameters:
  dataset:
    value: "cifar10"
  aggregation_type:
    value: "regular"
  dp:
    value: True
  local:
    value: False
  clipping:
    value: "server"
  noise_multiplier:
    values: [0.607, 0.2023, 0.1214] # 1, 3, 5 epsilon
  l2_norm_clip:
    values: [1, 5]
    # value: 5
  partition_type:
    value: "iid"
  n_clients:
    values: [3, 6, 10]
  learning_rate:
    value: 0.0005
  batch_size:
    value: 16
  epochs:
    value: 50


command:
  - ${env}
  - bash
  - ${program}
  - ${args}