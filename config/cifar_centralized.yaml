program: run.sh
project: privacy_preserving_federated_learning
method: grid

parameters:
  dataset:
    value: "cifar10"
  partition_type:
    value: "centralized"
  no_fl:
    value: True
  learning_rate:
    values: [0.001, 0.0001, 0.0005]
  batch_size:
    values: [4, 8, 16]
  epochs: 
    values: [10, 20, 50]

command:
  - ${env}
  - bash
  - ${program}
  - ${args}